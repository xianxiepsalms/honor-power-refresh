; 运行时配置，程序每次启动时读取，改完下次触发即生效，无需重新编译。
; 文件必须和 HonorPowerRefresh.exe 放在同一目录。
;
; 目标刷新率（Hz）。必须是当前分辨率下真实可用的档位，否则本次切换会被跳过。
; 留空、非数字或超出 1..1000 时，回退到内置默认值（AC 120 / 电池 60）。
; 接通电源（AC）时
AcRefreshRate=120
; 使用电池时
BatteryRefreshRate=60

; 切换方式：
;   Direct   = 用 Windows 标准 ChangeDisplaySettingsEx 一次设定目标 Hz（默认，无轮询）
;   HonorHal = 走荣耀 HardwareHal.dll!ChangeFrequency（按档位轮转，需多次调用）
; Direct 失败或读回不符时，若 DLL 存在会自动回退到 HonorHal。
SwitchMethod=Direct

; 是否把每次触发的结果追加到同目录的 HonorPowerRefresh.log
EnableLogging=false

; 部署配置 —— 改这里，然后运行 ./build.ps1（首次安装用 ./Install-HonorPowerRefresh.ps1）
;
; ExePath=auto        exe 放在本配置所在目录（默认）。整个目录搬走后无需改这行，
;                     重跑 build 即可自动适配新目录。
; ExePath=D:\xxx.exe  把 exe 部署到别处，源码目录与部署目录分离。
;                     build 会编译到该路径，并把任务指向同一路径。
ExePath=auto

; 计划任务名。改名后须重新导入（build 会把任务 XML 里的 URI 一并改成这个名字）。
TaskName=HonorPowerRefreshHook

; 任务定义 XML 模板。auto = 本目录下的 HonorPowerRefreshHook.xml
; 任务计划程序「导出」得到的 UTF-16 XML 可直接当模板；也可另存为 UTF-8。
; 本模板已脱敏：登录名、账户 SID、exe 绝对路径均替换为 REPLACE_ME_* 占位符，
; 不含本机身份信息，可安全提交/分享。改完 XML 执行 ./build.ps1 -TaskOnly 即生效。
;
; 模板内容除下列四处外一律原样导入：
;   <Command> / <URI> / <Principal><UserId> / <LogonTrigger><UserId>
; build 会自动填成 ExePath、\TaskName、当前用户 SID、当前用户名。
; 关于 <Command>：占位符属于被无条件覆盖的骨架值，不是配置；迁移时不用手改 XML。
; 唯一权威值是上面的 ExePath，系统从不读取工程里的这份 XML。
; 因此不要把模板直接拿去任务计划程序手动导入，那会把占位符写进生效态导致任务失效。
TaskXml=auto

; 注意：系统组件（Kernel-Power / Task Scheduler / Win32 API / .NET CLR）和荣耀
; HardwareHal.dll 的位置、命名属于外部环境，不在本配置范围内。
